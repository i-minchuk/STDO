version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
    container_name: iris-api-staging
    ports:
      - "8000:8000"
    environment:
      - DB_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/iris_staging
      - STORAGE_ROOT=/app/storage
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=WARNING
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - iris-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iris-frontend-staging
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - iris-network

  db:
    image: postgres:15-alpine
    container_name: iris-db-staging
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=iris_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - iris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d iris_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: iris-nginx-staging
    ports:
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - iris-network

volumes:
  postgres_data_staging:

networks:
  iris-network:
    driver: bridge
