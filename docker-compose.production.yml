version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE:-iris-api:latest}
    container_name: iris-api-prod
    ports:
      - "8000:8000"
    environment:
      - DB_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/iris
      - STORAGE_ROOT=/app/storage
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=WARNING
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - iris-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iris-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
    networks:
      - iris-network

  db:
    image: postgres:15-alpine
    container_name: iris-db-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=iris
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - iris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d iris"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  nginx:
    image: nginx:alpine
    container_name: iris-nginx-prod
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
      - frontend
    restart: always
    networks:
      - iris-network

  backup:
    image: postgres:15-alpine
    container_name: iris-backup
    volumes:
      - ./backups:/backups
      - postgres_data_prod:/data:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: >
      bash -c "
      while true; do
        pg_dump -h db -U ${POSTGRES_USER} iris > /backups/backup_\$(date +%Y%m%d_%H%M%S).sql &&
        find /backups -name 'backup_*.sql' -mtime +7 -delete;
        sleep 86400;
      done"
    depends_on:
      - db
    restart: always
    networks:
      - iris-network

volumes:
  postgres_data_prod:

networks:
  iris-network:
    driver: bridge
